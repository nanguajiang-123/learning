<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML表单</title>
</head>
<body>

        <input type="text" placeholder="请输入内容" id="username">

        <input type="checkbox" name="hobby" id="">sing

        <input type="submit">
    </form>

</html>
