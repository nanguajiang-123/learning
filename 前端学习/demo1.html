<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML练习</title>
</head>
<body>
    <h1>一级标题标签</h1>
    <h2>二级标题标签</h2>
    <p>这是一个段落标签</p>
    <p>更改文本样式，<b>字体加粗</b>，<i>斜体</i>，<u>下划线</u>，<s>删除</s></p>
    <ul>
        <li>
            无序列表项1
        </li>
        <li>
            无序列表项2
        </li>
        <li>
            无序列表项3
        </li>
    </ul>
    <ol>
        <li>
            有序列表项1
        </li>
        <li>
            有序列表项2
        </li>
        <li>
            有序列表项3
        </li>
    <ol>
    <table border="1">
        <tr>
            <th>列标题1</th>
            <th>列标题2</th>
            <th>列标题3</th>
        </tr>
        <tr>
            <td>元素1</td>
            <td>元素2</td>
            <td>元素3</td>
        </tr>
    </table>


<h1>HTML属性</h1>
<p>属性名称不区分大小写，属性值区分大小写</p>
</body>
</html>
